name: Update bookshelf

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch: {} # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/update_goodreads.py
      - .github/workflows/goodreads.yml

permissions:
  contents: write

concurrency:
  group: goodreads
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild bookshelf
        run: python scripts/update_goodreads.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: refresh Goodreads bookshelf"
            git push
          else
            echo "No changes to commit."
          fi
